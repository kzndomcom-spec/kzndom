<script>
(function(){
  var CONFIG={ webhook:'https://kzndom-lead.kzndomcom.workers.dev', metrikaId:97508515 };
  var LEAD_SOURCE='Каталог — MAX (Яндекс Директ)';
  var modal=document.getElementById('mx-modal');

  window.maxFallback=function(){
    var opened=false;
    var mark=function(){ if(document.hidden) opened=true; };
    document.addEventListener('visibilitychange', mark);
    window.addEventListener('pagehide', function(){ opened=true; }, {once:true});
    window.addEventListener('blur', function(){ opened=true; }, {once:true});
    setTimeout(function(){ if(!opened && !document.hidden){ openModal(); } }, 1400);
  };
  function openModal(){
    document.getElementById('mx-body').hidden=false;
    document.getElementById('mx-done').hidden=true;
    modal.classList.add('on');
    setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 250);
  }
  function closeModal(){ modal.classList.remove('on'); }
  document.getElementById('mx-close').addEventListener('click', closeModal);
  modal.addEventListener('click', function(e){ if(e.target===modal) closeModal(); });

  var inp=modal.querySelector('input[name=phone]');
  function pdigits(v){ var raw=String(v||'').replace(/\D/g,''); if(raw[0]==='8'||raw[0]==='7') raw=raw.slice(1); return raw.slice(0,10); }
  function validPhone(v){ return pdigits(v).length===10; }
  inp.setAttribute('inputmode','tel');
  inp.addEventListener('input', function(){
    inp.classList.remove('err');
    if(!inp.value.replace(/\D/g,'').length){ inp.value=''; return; }
    var raw=pdigits(inp.value), out='+7 ('+raw.slice(0,3);
    if(raw.length>3) out+=') '+raw.slice(3,6);
    if(raw.length>6) out+='-'+raw.slice(6,8);
    if(raw.length>8) out+='-'+raw.slice(8,10);
    inp.value=out;
  });

  function reachGoal(g){ try{ if(window.ym){ window.ym(CONFIG.metrikaId,'reachGoal',g); } }catch(e){} }
  function deliver(pl){ try{ fetch(CONFIG.webhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pl)}).catch(function(){}); }catch(e){} }

  document.getElementById('mx-form').addEventListener('submit', function(e){
    e.preventDefault();
    if(!validPhone(inp.value)){ inp.classList.add('err'); inp.focus(); return; }
    reachGoal('max_lead'); reachGoal('lead');
    deliver({source:LEAD_SOURCE, phone:inp.value, details:'Аварийная форма MAX (приложение не открылось)'});
    document.getElementById('mx-body').hidden=true;
    document.getElementById('mx-done').hidden=false;
  });
})();
</script>
